<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lamborghini | AR Experience</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root {
            --primary: #ffffff;
            --accent: #ff4500;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--primary);
            overflow: hidden;
        }

        /* Full-screen viewer */
        model-viewer {
            width: 100vw;
            height: 100vh;
            --poster-color: transparent;
        }

        /* Top Header Badge */
        .header-badge {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 10;
        }

        /* Bottom Floating UI */
        .bottom-shelf {
            position: absolute;
            bottom: 40px;
            left: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .car-title {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        /* Premium AR Button */
        .ar-button {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 18px 40px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }

        .ar-button:active {
            transform: scale(0.95);
        }

        /* Loading Indicator Customization */
        #lazy-load-poster {
            position: absolute;
            left: 0; right: 0; top: 0; bottom: 0;
            display: flex; justify-content: center; align-items: center;
            background: #000;
        }

    </style>
</head>
<body>

    <div class="header-badge">Automobili Lamborghini</div>

    <model-viewer 
        src="Huracan-EVO-RWD-Spyder-opt-22.usdz" 
        ios-src="Huracan-EVO-RWD-Spyder-opt-22.usdz"
        ar 
        ar-modes="scene-viewer quick-look webxr" 
        camera-controls 
        auto-rotate
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral">
        
        <div class="bottom-shelf">
            <div class="car-title">Huracán EVO Spyder</div>
            <button slot="ar-button" class="ar-button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                VIEW IN YOUR SPACE
            </button>
        </div>

    </model-viewer>

</body>
</html>
