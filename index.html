<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff; /* Clean Light Mode */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* The Centered Button */
        .ar-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #007AFF; /* Standard iOS/Mobile Blue */
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            z-index: 100;
            white-space: nowrap;
        }

        .ar-button:active {
            background-color: #005ecb;
            transform: translate(-50%, -50%) scale(0.98);
        }
    </style>
</head>
<body>

    <model-viewer 
        src="Huracan-EVO-RWD-Spyder-opt-22.usdz" 
        ios-src="Huracan-EVO-RWD-Spyder-opt-22.usdz"
        ar 
        ar-modes="quick-look scene-viewer webxr" 
        camera-controls>
        
        <button slot="ar-button" class="ar-button">
            View in AR
        </button>
        
    </model-viewer>

</body>
</html>
